<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flick Zap</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
  <div id="auth-page">
    <div class="auth-container">
      <div class="auth-header">
        <div class="auth-logo">
          <i class="fas fa-bolt"></i>
          <h1>Flick Zap</h1>
        </div>
        <p class="auth-subtitle">Общайся. Сотрудничай. Твори.</p>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" data-tab="login">Вход</button>
        <button class="auth-tab" data-tab="register">Регистрация</button>
      </div>

      <form id="login-form" class="auth-form active">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="login-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Войти</button>
        <p class="form-error" id="login-error"></p>
      </form>

      <form id="register-form" class="auth-form">
        <div class="form-group">
          <label>Имя пользователя</label>
          <input type="text" id="reg-username" placeholder="username" required>
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" placeholder="your@email.com" required>
        </div>
        <div class="form-group">
          <label>Пароль</label>
          <input type="password" id="reg-password" placeholder="••••••••" required>
        </div>
        <button type="submit" class="btn-primary">Создать аккаунт</button>
        <p class="form-error" id="reg-error"></p>
      </form>
    </div>
  </div>

  <div id="app" style="display:none;">
    <div class="sidebar-left">
      <div class="server-list">
        <div class="server-item home-btn" title="Главная" onclick="showHome()">
          <i class="fas fa-bolt"></i>
        </div>
        <div class="server-divider"></div>
        <div id="server-list-items"></div>
        <div class="server-item add-server" title="Создать сервер" onclick="showCreateServer()">
          <i class="fas fa-plus"></i>
        </div>
      </div>

      <div class="sidebar-content">
        <div class="sidebar-header">
          <h2 id="current-server-name">Главная</h2>
        </div>
        <div class="channel-list" id="channel-list">
          <div class="channel-category">
            <span>Каналы</span>
          </div>
        </div>
        <div class="user-list" id="user-list"></div>
        <div class="dm-list" id="dm-list">
          <div class="channel-category">
            <span>Личные сообщения</span>
          </div>
        </div>
      </div>
    </div>

    <div class="main-content">
      <div class="chat-header" id="chat-header">
        <div class="chat-header-info">
          <i class="fas fa-hashtag"></i>
          <span id="current-channel-name">Добро пожаловать</span>
        </div>
        <div class="chat-header-actions">
          <button onclick="showSearch()" title="Поиск"><i class="fas fa-search"></i></button>
        </div>
      </div>

      <div class="messages-area" id="messages-area">
        <div class="welcome-message">
          <div class="welcome-icon"><i class="fas fa-bolt"></i></div>
          <h2>Добро пожаловать в Flick Zap</h2>
          <p>Выберите канал или сервер чтобы начать общение</p>
        </div>
      </div>

      <div class="message-input-area" id="message-input-area" style="display:none;">
        <div class="typing-indicator" id="typing-indicator"></div>
        <div class="input-wrapper">
          <input type="text" id="message-input" placeholder="Напишите сообщение..." autocomplete="off">
          <button onclick="sendMessage()"><i class="fas fa-paper-plane"></i></button>
        </div>
      </div>
    </div>

    <div class="sidebar-right" id="sidebar-right">
      <div class="members-panel">
        <h3>Участники</h3>
        <div id="members-list"></div>
      </div>
    </div>
  </div>

  <div id="create-server-modal" class="modal" style="display:none;">
    <div class="modal-content">
      <h2>Создать сервер</h2>
      <input type="text" id="new-server-name" placeholder="Название сервера">
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Отмена</button>
        <button class="btn-primary" onclick="createServer()">Создать</button>
      </div>
    </div>
  </div>

  <div id="search-modal" class="modal" style="display:none;">
    <div class="modal-content modal-lg">
      <h2>Поиск</h2>
      <input type="text" id="search-input" placeholder="Поиск пользователей..." oninput="searchUsers(this.value)">
      <div id="search-results" class="search-results"></div>
      <div class="modal-actions">
        <button class="btn-secondary" onclick="closeModal()">Закрыть</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
